[[permission]]
identifier = "allow-get-hook-status"
description = "Allows reading the last emitted input-hook status"
commands.allow = ["get_hook_status"]

[[permission]]
identifier = "allow-get-capture-settings"
description = "Allows reading keyboard/mouse capture toggles"
commands.allow = ["get_capture_settings"]

[[permission]]
identifier = "allow-set-capture-settings"
description = "Allows updating keyboard/mouse capture toggles"
commands.allow = ["set_capture_settings"]

[[permission]]
identifier = "allow-arm-ignore-key-capture"
description = "Allows arming capture of the next key for the ignore list"
commands.allow = ["arm_ignore_key_capture"]

[[permission]]
identifier = "allow-cancel-ignore-key-capture"
description = "Allows cancelling ignore-key capture without adding a key"
commands.allow = ["cancel_ignore_key_capture"]

[[permission]]
identifier = "allow-get-hud-style-settings"
description = "Allows reading HUD appearance and dwell settings"
commands.allow = ["get_hud_style_settings"]

[[permission]]
identifier = "allow-set-hud-style-settings"
description = "Allows updating HUD appearance and dwell settings"
commands.allow = ["set_hud_style_settings"]

[[permission]]
identifier = "allow-get-hud-position-settings"
description = "Allows reading HUD overlay position settings"
commands.allow = ["get_hud_position_settings"]

[[permission]]
identifier = "allow-set-hud-position-settings"
description = "Allows updating HUD overlay position settings"
commands.allow = ["set_hud_position_settings"]

[[permission]]
identifier = "allow-start-hud-place-mode"
description = "Allows entering HUD drag-to-place mode"
commands.allow = ["start_hud_place_mode"]

[[permission]]
identifier = "allow-end-hud-place-mode"
description = "Allows exiting HUD drag-to-place mode and persisting custom position"
commands.allow = ["end_hud_place_mode"]

[[permission]]
identifier = "allow-get-ui-locale-settings"
description = "Allows reading persisted UI language"
commands.allow = ["get_ui_locale_settings"]

[[permission]]
identifier = "allow-set-ui-locale-settings"
description = "Allows updating persisted UI language"
commands.allow = ["set_ui_locale_settings"]

[[permission]]
identifier = "allow-get-ui-appearance-settings"
description = "Allows reading persisted main-window appearance"
commands.allow = ["get_ui_appearance_settings"]

[[permission]]
identifier = "allow-set-ui-appearance-settings"
description = "Allows updating persisted main-window appearance"
commands.allow = ["set_ui_appearance_settings"]
