[package]
name = "z-key-cast"
version = "1.0.0"
description = "Corner HUD for keyboard and mouse actions while screen recording"
authors = ["you"]
edition = "2021"

[lib]
name = "z_key_cast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
