[package]
name = "z-key-cast"
version = "1.6.0"
description = "Corner HUD for keyboard and mouse actions while screen recording"
authors = ["you"]
edition = "2021"

[lib]
name = "z_key_cast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Optional: linked by `pnpm tauri build` and `pnpm tauri:build-test`. `tauri:build-once` omits it.
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
default = []
# Public `tauri build` and `tauri:build-test`. Pubkey and endpoint come from the merge config, not this feature.
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
