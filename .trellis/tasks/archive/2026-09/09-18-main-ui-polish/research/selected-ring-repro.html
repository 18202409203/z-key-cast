<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Selected-ring probe — B (outside ring) vs A+C vs pre-fix, + panel clip (2x device px)</title>
<style>
  :root { --radius-md: 10px; --radius-lg: 12px; --panel-pad-x: 16px; }

  /* Token maps mirrored from src/routes/+page.svelte (dark / light). */
  [data-appearance="light"] {
    --app-bg: #ffffff;
    --app-fg: #1d1d1f;
    --app-muted: #6e6e73;
    --app-accent: #007aff;
    --app-inset: #f2f2f7;
    --app-control-border: #d1d1d6;
    --app-hairline: rgba(0, 0, 0, 0.08);
  }
  [data-appearance="dark"] {
    --app-bg: #1c1c1e;
    --app-fg: #f5f5f7;
    --app-muted: #98989d;
    --app-accent: #0a84ff;
    --app-inset: #2c2c2e;
    --app-control-border: #48484a;
    --app-hairline: rgba(255, 255, 255, 0.08);
  }

  html, body { margin: 0; }
  body {
    background: #7f7f7f;
    font: 10px/14px system-ui, sans-serif;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    padding: 24px;
    align-items: flex-start;
  }
  /* 96px content width → the frame's `width:100%; max-width:96px` resolves to
     exactly 96 px content (100x76 border box, content-box frame as shipped). */
  .cell { width: 96px; padding: 24px; background: var(--app-bg); }
  /* Sub-pixel offset (24.33px) → device-px misalignment, as a fractional grid
     column produces in the real shell. Content width stays 96. */
  .cell.half { padding-left: 24.33px; padding-right: 23.67px; }
  .lbl { display: block; margin-top: 6px; white-space: nowrap; }
  .cell .lbl { color: var(--app-fg); }
  /* `.choice-card:has(input:disabled) { opacity: .55 }` — card-level opacity,
     composited over the opaque panel background. */
  .dim { opacity: 0.55; }

  /* ============================================================
     `.choice-card--fill .schematic-frame` — verbatim from
     src/lib/components/ChoiceCardGroup.svelte
     ============================================================ */
  .frame {
    display: block;
    width: 100%;
    max-width: 96px;
    aspect-ratio: 4 / 3;
    justify-self: center;
    border-radius: var(--radius-md);
    border: 2px solid var(--app-control-border);
    overflow: hidden;
    background: var(--app-inset);
  }

  /* `old` (pre-R4 baseline): 2px accent border + extra 1px accent box-shadow.
     Band from the arc centre = 8..10 css px (16..20 device px), plus the 1px
     shadow arc outside it. */
  .frame.old {
    border-color: var(--app-accent);
    box-shadow: 0 0 0 1px var(--app-accent);
  }

  /* `ac` (option A+C): 2px accent border only. Same 8..10 css px band. */
  .frame.ac { border-color: var(--app-accent); }

  /* `new (B)` — verbatim:
       `.choice-card--fill:has(input:checked) .schematic-frame` {
         outline: 2px solid var(--app-accent);
         outline-offset: 2px;
       }
     The tile keeps its neutral 2px border in BOTH states. Ring band from the
     arc centre = 12..14 css px (24..28 device px); the 2 css px offset is the
     transparent gap that shows the page/group backdrop. */
  .frame.b {
    outline: 2px solid var(--app-accent);
    outline-offset: 2px;
  }

  /* ============================================================
     `.choice-card--fill .schematic` — verbatim (post-B; the A+C
     block — box-sizing / transparent border / inner radius / overflow
     — is reverted, so the art is full-bleed again).
     ============================================================ */
  .schematic {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .schematic svg { display: block; width: 100%; height: 100%; }

  /* A+C extras (superseded): 1px transparent inset border + own radius/clip,
     so the ring's inner arc met a 1px `--app-inset` band instead of the art. */
  .schematic.ac {
    box-sizing: border-box;
    border: 1px solid transparent;
    border-radius: calc(var(--radius-md) - 2px);
    overflow: hidden;
  }

  /* ============================================================
     Clip section: the real Appearance-panel chain, verbatim selectors:
     window/body (overflow:hidden) >
     .shell (max-width:560px, overflow-x/y:hidden, padding 0 0 16px) >
     .panels > .panel (overflow-x:hidden / overflow-y:auto,
     padding-inline:var(--panel-pad-x)) >
     .form-section > .form-group (radius-lg, background inset,
     overflow:hidden) > .form-row--stack (padding 12px 14px) >
     .form-row-control > .choice-group (3 cols, gap 10px 8px).
     `--shell-max: 560px` caps the panel at 560px for any window ≥ 560,
     so 600 (== tauri `minWidth`) and 900 differ only by the side margins.
     ============================================================ */
  .clipwrap { flex-basis: 100%; display: flex; flex-direction: column; gap: 20px; }
  .clipcase { display: grid; gap: 4px; }
  .clipcase > .lbl { margin: 0; color: #1d1d1f; }

  .windowbox { overflow: hidden; background: var(--app-bg); }
  .shell {
    box-sizing: border-box;
    height: 100%;
    width: 100%;
    max-width: 560px;
    margin-inline: auto;
    padding: 0 0 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-x: hidden;
    overflow-y: hidden;
    color: var(--app-fg);
    /* Marker only: an outline never affects layout or the clip rect. */
    outline: 1px dashed #ff0000;
  }
  .top { flex: none; height: 44px; background: var(--app-control-bg); }
  .panels {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding-inline: var(--panel-pad-x);
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
    background: var(--app-bg);
    color: var(--app-fg);
  }
  .form-section { display: grid; gap: 8px; min-width: 0; }
  .form-section-title {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--app-muted);
  }
  .form-group {
    display: grid;
    min-width: 0;
    border-radius: var(--radius-lg);
    background: var(--app-inset);
    overflow: hidden;
  }
  .form-row--stack {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: stretch;
    padding: 12px 14px;
    min-width: 0;
    font-size: 13px;
  }
  .form-row-control { display: grid; gap: 8px; min-width: 0; justify-items: stretch; }
  .choice-group {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px 8px;
  }
  .choice-card {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 8px;
    min-width: 0;
    padding: 0;
    border: none;
    background: transparent;
    border-radius: 0;
    color: var(--app-muted);
    cursor: pointer;
  }
  .choice-card:has(input:checked) { color: var(--app-fg); }
  .choice-card input { position: absolute; opacity: 0; pointer-events: none; }
  .choice-label { font-size: 12px; font-weight: 500; line-height: 1.25; text-align: center; }
</style>
</head>
<body>
<script>
  // Fixed art swatches (Appearance schematics use fixed swatches, not live tokens).
  const ART = {
    light:
      '<svg viewBox="0 0 80 56" preserveAspectRatio="xMidYMid slice">' +
      '<rect width="80" height="56" fill="#ffffff"/>' +
      '<rect x="10" y="12" width="60" height="32" rx="5" fill="#f2f2f7"/>' +
      '<rect x="16" y="22" width="24" height="8" rx="2" fill="#ffffff"/></svg>',
    dark:
      '<svg viewBox="0 0 80 56" preserveAspectRatio="xMidYMid slice">' +
      '<rect width="80" height="56" fill="#1c1c1e"/>' +
      '<rect x="10" y="12" width="60" height="32" rx="5" fill="#2c2c2e"/>' +
      '<rect x="16" y="22" width="24" height="8" rx="2" fill="#3a3a3c"/></svg>',
  };

  // Ring band, in css px from the tile's arc centre (= outer border-box corner
  // + radius). `ref-in` / `ac` / `old` paint the accent on the tile's own
  // border (radius - 2 .. radius); `new (B)` paints it outside, offset 2..4.
  const BAND_IN = "8,10";
  const BAND_OUT = "12,14";

  /* ---------- section 1: ring variants (one cell each) ---------- */
  const variants = [];
  for (const ap of ["light", "dark"]) {
    const art = ART[ap];
    const schematic = (cls, inner) =>
      `<span class="schematic${cls ? ` ${cls}` : ""}">${inner ?? ""}</span>`;

    variants.push({
      ap,
      probe: `${ap}-ref`, // ideal B ring, no art → engine AA floor for the outside ring
      label: "ref (ideal B ring, no art)",
      frame: "frame b",
      inner: schematic(""),
      band: BAND_OUT,
    });
    variants.push({
      ap,
      probe: `${ap}-refin`, // ideal inner 2px ring, no art → floor for old/ac
      label: "ref-in (ideal 2px border, no art)",
      frame: "frame ac",
      inner: schematic("ac"),
      band: BAND_IN,
    });
    variants.push({
      ap,
      probe: `${ap}-old`, // pre-fix: 2px accent border + 1px accent shadow + art to the inner arc
      label: "old (pre-fix)",
      frame: "frame old",
      inner: schematic("", art),
      band: BAND_IN,
    });
    variants.push({
      ap,
      probe: `${ap}-ac`, // A+C: 2px accent border + 1px inset gap; art shrunk to 94x70
      label: "ac (A+C)",
      frame: "frame ac",
      inner: schematic("ac", art),
      band: BAND_IN,
    });
    variants.push({
      ap,
      probe: `${ap}-new`, // B, shipped: outline ring outside + full-bleed 96x72 art
      label: "new (B)",
      frame: "frame b",
      inner: schematic("", art),
      band: BAND_OUT,
    });
    variants.push({
      ap,
      probe: `${ap}-unsel`, // B unselected: neutral border, no ring, same geometry
      label: "unsel (B)",
      frame: "frame",
      inner: schematic("", art),
      band: BAND_OUT,
    });
    variants.push({
      ap,
      probe: `${ap}-half`, // B + 0.33 css px sub-pixel offset (fractional grid column)
      label: "half (B)",
      frame: "frame b",
      inner: schematic("", art),
      band: BAND_OUT,
      half: true,
    });
    variants.push({
      ap,
      probe: `${ap}-disabled`, // `.choice-card:has(input:disabled) { opacity: .55 }`
      label: "disabled (B)",
      frame: "frame b",
      inner: schematic("", art),
      band: BAND_OUT,
      dim: true,
    });
  }

  document.body.insertAdjacentHTML(
    "beforeend",
    variants
      .map(
        (v) =>
          `<div class="cell${v.half ? " half" : ""}" data-appearance="${v.ap}">` +
          (v.dim
            ? `<div class="dim"><div class="${v.frame}" data-probe="${v.probe}" data-band="${v.band}">${v.inner}</div></div>`
            : `<div class="${v.frame}" data-probe="${v.probe}" data-band="${v.band}">${v.inner}</div>`) +
          `<span class="lbl">${v.probe}<br>${v.label}</span></div>`,
      )
      .join(""),
  );

  /* ---------- section 2: panel clip cases (first/last column tiles) ---------- */
  const clipCases = [
    { id: "clip600-light", width: 600, ap: "light" },
    { id: "clip600-dark", width: 600, ap: "dark" },
    { id: "clip900-light", width: 900, ap: "light" },
    { id: "clip900-dark", width: 900, ap: "dark" },
  ];

  const card = (checked, ap, name, idx) => {
    const art = ART[ap];
    return (
      `<label class="choice-card"><input type="radio" name="${name}"${checked ? " checked" : ""}>` +
      `<div class="${checked ? "frame b" : "frame"}" data-probe="${name}-t${idx}" data-band="${BAND_OUT}">` +
      `<span class="schematic">${art}</span></div>` +
      `<span class="choice-label">t${idx}</span></label>`
    );
  };

  document.body.insertAdjacentHTML(
    "beforeend",
    `<div class="clipwrap">` +
      clipCases
        .map(
          (c) =>
            `<div class="clipcase">` +
            `<span class="lbl">${c.id} — window ${c.width}px, ${c.ap}; first/last column tiles selected</span>` +
            `<div class="windowbox" data-appearance="${c.ap}" style="width:${c.width}px;height:260px" data-probe="${c.id}-window">` +
            `<div class="shell" data-probe="${c.id}-shell">` +
            `<div class="top"></div>` +
            `<div class="panels">` +
            `<div class="panel" data-probe="${c.id}-panel">` +
            `<section class="form-section">` +
            `<h2 class="form-section-title">Appearance</h2>` +
            `<div class="form-group" data-probe="${c.id}-group">` +
            `<div class="form-row--stack">` +
            `<div class="form-row-control">` +
            `<div class="choice-group" data-probe="${c.id}-grid">` +
            card(true, c.ap, c.id, 0) +
            card(false, c.ap, c.id, 1) +
            card(true, c.ap, c.id, 2) +
            `</div></div></div></div></section></div></div></div></div></div>`,
        )
        .join("") +
      `</div>`,
  );

  // Geometry dump for the pixel probe (used with `--dump-dom`).
  addEventListener("load", () => {
    const pre = document.createElement("pre");
    pre.id = "geo";
    pre.style.display = "none";
    pre.textContent = [...document.querySelectorAll("[data-probe]")]
      .map((el) => {
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el);
        return `${el.dataset.probe} ${r.left} ${r.top} ${r.width} ${r.height} ${cs.borderTopWidth} ${cs.borderRadius} ${el.dataset.band ?? "-"}`;
      })
      .join("\n");
    document.body.appendChild(pre);
  });
</script>
</body>
</html>
